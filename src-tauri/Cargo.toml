[package]
name = "swarm-graph"
version = "1.0.0"
description = "SwarmGraph — живой визуализатор графов /swarm и субагентов Antigravity"
authors = ["kotpe"]
edition = "2021"

[lib]
name = "swarm_graph_lib"
crate-type = ["rlib"]
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "fs", "macros"] }
dirs = "5"
regex = "1"
base64 = "0.22"
