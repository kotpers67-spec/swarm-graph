<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var saved = localStorage.getItem("swarmgraph-color-scheme");
        if (saved === "light" || saved === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = saved;
        }
        var savedFont = localStorage.getItem("swarmgraph-font-family");
        if (savedFont) {
          document.documentElement.setAttribute("data-font", savedFont);
        }
      } catch (_) {}
    </script>
    <title>SwarmGraph — Графы работы агентов</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
